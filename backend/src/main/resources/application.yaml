spring:
  application:
    name: LibMS

  # Database config
  datasource:
    url: jdbc:mysql://localhost:3306/LibMS#?createDatabaseIfNotExist = true
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    generate-ddl: true
    show-sql: true
    hibernate:
      ddl-auto: create
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher